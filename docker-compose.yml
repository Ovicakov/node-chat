services:
  app:
    env_file:
      - .env
    build: .
    ports:
      - "8080:3000"
    environment:
      - HOST=${HOST}
      - PORT=${PORT}
    depends_on:
      - db
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
